# Install at /etc/nginx/conf.d/knowledge-hub.conf (one-time, by an admin).
# Each pipeline variant is served as a sub-path: http://<vm>:8080/<variant>/
# Symlink swaps by deploy.sh need no nginx reload.

# UAT users
server {
    listen 8080;
    server_name _;
    root /var/www/knowledge-hub/uat;
    include /etc/nginx/snippets/knowledge-hub-common.conf;
}

# Development
server {
    listen 8081;
    server_name _;
    root /var/www/knowledge-hub/dev;
    include /etc/nginx/snippets/knowledge-hub-common.conf;
}
