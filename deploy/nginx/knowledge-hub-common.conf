# Install at /etc/nginx/snippets/knowledge-hub-common.conf
# Serves /<variant>/... from <root>/<variant>/current/...

gzip on;
gzip_types text/css application/javascript application/json text/plain image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

location = / { return 302 /default/; }

# /fms -> /fms/
location ~ ^/(?<variant>[a-z0-9_-]+)$ { return 301 /$variant/; }

# Vite emits content-hashed filenames here.
location ~ ^/(?<variant>[a-z0-9_-]+)/assets/(?<rest>.*)$ {
    expires 1y;
    try_files /$variant/current/assets/$rest =404;
}

# Entry points must never be cached so a new release is picked up immediately.
location ~ ^/(?<variant>[a-z0-9_-]+)/(?<rest>index\.html|version\.txt)$ {
    expires -1;
    try_files /$variant/current/$rest =404;
}

location ~ ^/(?<variant>[a-z0-9_-]+)/(?<rest>.*)$ {
    try_files /$variant/current/$rest /$variant/current/$rest/index.html =404;
}
