  business_rules:
  - id: BR-01
    rule: Order Pre-requisite
    notes: Events can only be posted for transport orders previously confirmed by a successful PLN call
      (HTTP 202). If the order has not been transmitted or has been canceled (APLN), event generation
      is blocked in AndSoft TMS.
  - id: BR-02
    rule: Milestone Sequencing
    notes: 'Milestone sequencing should follow logical transport progression: ARRIVED_PICKUP → LOADED
      / CON_LOAD → DEPARTED_PICKUP → ARRIVED_DELIVERY → DELIVERED / CON_UNLOAD. Out-of-order events are
      ingested by Shippeo but trigger timeline recalibrations.'
  - id: BR-03
    rule: Incident & Exception Handling
    notes: An INCIDENT or anomaly event (e.g. GOODS_LOADED_NOT_CONFORM, ORDER_NOT_LOADED_ENTIRELY_MISSING)
      does not close a transport order; it adds an anomaly flag, triggers an ETA revision, and alerts
      dispatchers without interrupting GPS tracking.
  - id: BR-04
    rule: Final Delivery & Tracking Closure
    notes: A DELIVERED or CON_UNLOAD event on the final delivery leg automatically flags the shipment
      as completed in Shippeo and closes active GPS tracking. POD attachments must be included if available
      in TMS at validation time.
  - id: BR-05
    rule: Idempotent De-duplication
    notes: If an event with the same eventReference or identical triplet (orderReference, eventCode, eventDateTime)
      is resent, Shippeo treats it idempotently without duplicating milestones, preventing redundant entries
      from network retries.
  - id: BR-06
    rule: WMS / External Validation Priority
    notes: When execution milestones are recorded in CAT compound WMS (2020PF / Inform WMS) or directly
      by dispatchers in AndSoft e-TMS, they are immediately published to Shippeo as Events-in to maintain
      single-source tracking.
