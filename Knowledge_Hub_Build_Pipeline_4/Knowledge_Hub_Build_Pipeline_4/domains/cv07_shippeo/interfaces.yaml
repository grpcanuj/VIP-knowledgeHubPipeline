# Domain: CV07_01 TMS -> Shippeo transport orders (Create/Update/Cancel, PLN/APLN)
# Promoted from interfaces.draft.yaml after human review.

interfaces:
- id: CV07_01
  name: CV07_01_TMS_SHIP_ORDERS
  description: The purpose of this integration is to transmit the transport orders planned from TMS to
    Shippeo, so that each vehicle movement can be tracked (RTTV/GPS), instructed to the driver through
    the Shippeo mobile application AndSoft connects to the Shippeo Orders-in webservice to send transport
    orders (PLN) and their cancellations/amendments (APLN) to Shippeo. The payload format is JSON.
  source_system: AndSoft TMS
  target_system: Shippeo
  protocol: REST
  method: POST
  endpoint_url: https://TBD/api/v1/ tms-2-ship-orders/{orderId}
  frequency: Async, on transport order event
  owner: AndSoft
  spec_type: vendor-template
  spec_version: V1.0
  status: documented
  idempotent: false
  retry_policy: No — each accepted call creates or updates the transport order tracked in Shippeo. On
    a 520 response, the same call (identical payload) is resent, up to 5 times.
  response_contract: status-code only, no structured body (see endpoint table)
  response_status_codes:
  - code: '202'
    meaning: Accepted
    description: The order request (PLN or APLN) is valid and has been accepted/queued for processing
      by Shippeo.
  - code: '520'
    meaning: Server error (Shippeo-specific)
    description: A server-side error occurred on Shippeo's side. The same call must be resent, up to 5
      retries.
  required_headers:
  - header: Content-Type
    value: application/json
    notes: Required
    required: true
  - header: Accept
    value: application/json
    notes: Required
    required: true
  - header: Authorization
    value: Bearer [access_token]
    notes: Required. Token obtained from the prior Shippeo token request call (UAT / Production credentials).
    required: true
  - header: X-Request-ID
    value: '[uuid-v4]'
    notes: Optional — useful for tracing/troubleshooting
    required: false
  - header: Authorization
    value: Bearer [access_token]
    notes: Optional / To be confirmed. Required only if authentication is managed through a bearer token.
    required: false
  - header: X-API-Key
    value: '[api-key]'
    notes: Optional / To be confirmed. Required only if authentication is managed through an API key.
    required: false
  - header: '[X-Custom]'
    value: '[value]'
    notes: Optional. Any additional technical header injected by the authentication or integration layer.
    required: false
  field_validation_rules:
  - field: estimatedDepartureDate (ETD)
    rule: Must not be earlier than today's date
    error_code: VALIDATION_ERROR
    message: If ETD < date of today, the PLN is blocked (rule currently enforced in EDI).
  - field: Actual Trp, Truck plate, Driver, ETD, ETA, Pickup point, Delivery point, veh ID, Shippeo order
      suffix, lib_lot_fourn
    rule: Mandatory before the first PLN can be sent
    error_code: VALIDATION_ERROR
    message: The PLN is only sent once all of these fields are filled in (business rule 1).
  - field: All *Date / dateTime fields
    rule: ISO 8601 UTC format “YYYY-MM-DDThh:mm:ssZ”
    error_code: VALIDATION_ERROR
    message: messageDate, pickUp.dates[].dateTime, consignee.dates[].dateTime, etc.
  business_rules:
  - id: BR-01
    rule: 'A PLN is sent once all of the following are filled in: Actual Trp, Truck plate, ETD, ETA, Pickup
      point, Delivery point, veh ID, Shippeo order suffix, lib_lot_fourn. Driver is optional, but it must
      be present for AndSoft/2020 because it determines the truck plate.'
    notes: For AndSoft planned load/order, these data should come from AndSoft only. If ETD < today, the
      PLN is blocked.
  - id: BR-02
    rule: If one of ETD, ETA, Pickup point or Delivery point is modified after the first sending, a new
      PLN is triggered (without any APLN).
    notes: For AndSoft planned load/order, these data/changes should come from AndSoft only. If ETD <
      today, the PLN is blocked.
  - id: BR-03
    rule: If one of Actual Trp, Truck plate, ETD, ETA, veh ID, Pickup point, Delivery point, Shippeo order
      suffix or lib_lot_fourn goes from filled in to blank, an APLN is triggered.
    notes: For AndSoft planned load/order, these data/changes should come from AndSoft only.
  - id: BR-04
    rule: If one of Actual Trp, Truck plate, veh ID, Shippeo order suffix or lib_lot_fourn is modified
      (i.e. changes from one non-null value to another non-null value), both an APLN and a new PLN are
      triggered.
    notes: For AndSoft planned load/order, these data/changes should come from AndSoft only. If ETD <
      today, the PLN is blocked.
  - id: BR-05
    rule: 'One JSON call corresponds to one lot: vehicles are grouped by lot number.'
    notes: ''
  - id: BR-06
    rule: As soon as the transport is completed in the TMS (namely the delivery is confirmed), no further
      PLN is to be sent.
    notes: ''
